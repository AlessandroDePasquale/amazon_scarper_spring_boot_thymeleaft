<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
    <title>Lista prodotti</title>
</head>

<body>


    <div class="container">

        <h3>Lista prodotti</h3>

        <hr>

        <a th:href="@{/production/form-add-production}"
                class="btn btn-primary btn-sm m-3"
                style="color: aliceblue;">Aggiungi prodotto</a>

        <hr>

        <!-- classi da bootstrap per lo stile della tabella -->
        <table class="table table-bodered table-striped">

            <thead class="table-dark">

                <tr>
                    <th>N°</th>
                    <th>Titolo</th>
					<th>Link</th>
					<th>Stelle</th>
					<th>Prezzo ora</th>
					<th>Prezzo desiderato</th>
					<th>Tempo per recupero dati</th>
					<th>Modifica</th>
					<th>Cancella</th>
                </tr>

            </thead>

            <tbody>
                
                <!-- tr sta per row della tabella , in questa inseirmeno una temp var che 
                    continne ennessimo elemento della lista di prodotti inviata dal backend con il nome 
                    ${productions} , qundi si fa th:each="nomeVar : (: per assegnazione suppongo) ${nomeVarInArrivoDAlBackEnd}"-->
                <tr th:each="tempProduction : ${productions}">
                    
                    <td th:text="${tempProduction.id}"/>
                    <td th:text="${tempProduction.titleProdotto}"/>
                    <td>
                        <a th:text="${tempProduction.link}" th:href="${tempProduction.link}" target="_blank"></a>
                    </td>  
                    <td th:text="${tempProduction.rating}"/>
                    <td th:text="${tempProduction.priceNow}"/>
                    <td th:text="${tempProduction.priceTarget}"/>
                    <td th:text="${tempProduction.timeToRetrive}"/>
                    <td> <!-- class="text-center" -->
                        <!-- dont missing th: . . . -->
                        <a th:href="@{/production/form-update-production(id=${tempProduction.id})}"
                            class="btn btn-primary btn-sm">Aggiorna</a>
                        <!--<form th:action="@{/employees/modify}" th:object="${tempProduction}" method="put">
                            <button  type="submit" class="btn btn-primary btn-sm">Modify</button>
                        </form>-->
                    </td>
                    <td>
                        <form th:action="@{/production/delete}" method="get">
                            <!-- value ste to seend param to java spring boot-->
                            <input type="hidden" name="id" th:value="${tempProduction.id}">
                            <button type="submit" class="btn btn-danger btn-sm"
                                onclick="if (!(confirm('Are you sure you want to delete this production?'))) return false">
                                Cancella</button>
                        </form>
                    </td>

                </tr>

            </tbody>

        </table>
            
        <br>

        <hr>

        <a th:href="@{/production/index}"
            class="btn btn-primary btn-sm m-3"
            style="color: aliceblue;">Vai alla pagina di benvenuto</a>

        <a th:href="@{/production/exit-close}"
            class="btn btn-danger btn-sm m-3"
            style="color: aliceblue;">Spegni App</a>

        <hr>
      
            
    </div>

</body>

<script>


        function alertDelte(firstName){
            if (!(confirm('Are you sure to delte employee : ' + firstName + ' ?')))
                return false;
            
        }
    

</script>

</html>
